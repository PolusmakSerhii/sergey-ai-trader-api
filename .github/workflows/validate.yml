name: Validate backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Redis for isolated ledger tests
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npm test
